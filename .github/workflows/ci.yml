name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-fast-tests:
    name: Lint, types, unit & API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  contract:
    name: Pact consumer + provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACT_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Consumer contract
        run: npm run test:contract:consumer
      - name: Provider verification
        run: npm run test:contract:provider
      - name: Upload generated pact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pacts
          path: pacts/
          if-no-files-found: ignore

  integration:
    name: Integration (Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: Browser E2E + accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  publish-reports:
    name: Publish reports to Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [static-and-fast-tests, contract, integration, e2e, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site/report/
      - uses: actions/download-artifact@v8
        with:
          name: mutation-report
          path: site/mutation/
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: evidence/coverage/
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the latest performance summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow performance.yml --branch main --status success --limit 1 --json databaseId,number,createdAt --jq '.[0] // empty')
          if [ -n "$run" ]; then
            echo "PERF_RUN=$(jq -r .number <<<"$run")" >> "$GITHUB_ENV"
            echo "PERF_DATE=$(jq -r '.createdAt[:10]' <<<"$run")" >> "$GITHUB_ENV"
            gh run download "$(jq -r .databaseId <<<"$run")" -n k6-summary -D site/perf || echo "no k6 artifact on that run"
          fi
      - name: Fetch the latest AI evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow ai-eval.yml --branch main --status success --limit 1 --json databaseId,number,createdAt --jq '.[0] // empty')
          if [ -n "$run" ]; then
            echo "AI_RUN=$(jq -r .number <<<"$run")" >> "$GITHUB_ENV"
            echo "AI_DATE=$(jq -r '.createdAt[:10]' <<<"$run")" >> "$GITHUB_ENV"
            gh run download "$(jq -r .databaseId <<<"$run")" -n promptfoo-results -D site/ai-eval || echo "no promptfoo artifact on that run"
          fi
      - name: Capture an OpenTelemetry trace excerpt
        run: |
          mkdir -p site/traces
          npm run dev:otel > otel.log 2>&1 &
          server=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health >/dev/null && break; sleep 1; done
          id=$(curl -s -X POST -H 'content-type: application/json' -d '{"productId":"quality-lab","quantity":2}' http://127.0.0.1:3000/api/checkout | jq -r .orderId)
          curl -s "http://127.0.0.1:3000/api/orders/$id" >/dev/null
          sleep 2; kill "$server" || true; sleep 1
          {
            echo "# OpenTelemetry spans exported by the lab during CI run #${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA:0:7})"
            echo "# Requests: GET /api/health, POST /api/checkout, GET /api/orders/$id"
            echo
            grep -v "unsafe-perm" otel.log | head -400
          } > site/traces/spans.txt
      - name: Assemble the landing page
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          node pages/assemble.mjs site evidence
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > site/CNAME; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v5
